name: Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Start ArangoDB (docker compose)
        run: |
          docker compose up -d

      - name: Wait for ArangoDB
        run: |
          for i in {1..60}; do
            if curl -fsS -u root:openSesame "http://localhost:18529/_api/version" >/dev/null; then
              echo "ArangoDB is ready"
              exit 0
            fi
            sleep 1
          done
          echo "ArangoDB did not become ready in time"
          docker compose logs
          exit 1

      - name: Run integration tests
        env:
          RUN_INTEGRATION: "1"
          ARANGO_URL: "http://localhost:18529"
          ARANGO_DB: "schema_analyzer_it"
          ARANGO_USER: "root"
          ARANGO_PASS: "openSesame"
        run: |
          pytest -q -m integration

      # PRD §3.12.3 regression gate: run the deterministic no-LLM eval and
      # fail the build if any gated quality metric drops vs the committed
      # baseline. Regenerate the baseline with the same command (pointing
      # --report at eval/baselines/ci_no_llm_baseline.json) when an
      # intentional inference change shifts the scores.
      - name: Eval regression gate (no-LLM baseline compare)
        env:
          ARANGO_URL: "http://localhost:18529"
          ARANGO_USER: "root"
          ARANGO_PASS: "openSesame"
        run: |
          python -m schema_analyzer.cli eval \
            --report eval_report_ci.json \
            --baseline eval/baselines/ci_no_llm_baseline.json \
            --fail-on-regression

      - name: Stop ArangoDB
        if: always()
        run: |
          docker compose down -v

